name: Build APK

on:
push:  
branches: ["main"]
pull_request:
branches:["main"]

jobs:
build:  
 runs-on: ubuntu-latest
steps:
 -name: checkout code
 uses: actions/checkout@v3

 -name: Setup up JDK 17
 uses: actions/setup-java@v3
 with:
 java-version:'17'
 distribution: 'termurin'

 -name: setup gradle
 uses: Gradle/actions/setup-gradle@v3

 -name: Generator gradlew
 run: |
 Gradle wrapper --gradle-version 8.4
 chmod +x gradlew

 -name: create local.properties
 run: echo   "Sdk.dir=$ANROID_HOME" > local.properties

 -name: build debug APK
 run: ./gradlew assembleDebug

 -name: upload APK
 uses: action/uupload-artifact@v4
 with:
 name: Musicplayer-debug
 path: app/build/outut/apk/Debug/*.apk
